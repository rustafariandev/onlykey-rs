[package]
name = "okagent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "SSH agent backed by an OnlyKey hardware token"
readme = "../README.md"

[[bin]]
name = "okagent"
path = "src/main.rs"

[dependencies]
onlykey-agent = { path = "..", version = "0.1.0", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
signal-hook = "0.3"
nix = { version = "0.30", features = ["process", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
tempfile = "3"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
