[workspace]
members = ["okagent"]

[workspace.package]
version = "1.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/rustafariandev/onlykey-rs"

[workspace.lints.clippy]
all = "warn"

[package]
name = "onlykey-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Derive SSH keys and sign with an OnlyKey hardware token, plus an SSH agent built on it"
keywords = ["onlykey", "ssh", "ssh-agent", "hardware-token", "hid"]
categories = ["authentication", "cryptography", "hardware-support"]
readme = "README.md"

[features]
default = []
# `serde` derives on `Curve`, for config files.
serde = ["dep:serde"]
# Test doubles: a scripted HID transport (`transport::fake`) and a software
# FIDO authenticator (`fido::fake`), for testing code built on this crate.
test-util = []
# Accept plain DSA (`ssh-dss`) keys with `ssh-add FILE`. Off by default:
# OpenSSH disabled DSA in 9.8 and removed it in 10.0.
dsa = ["ssh-key/dsa", "ssh-agent-kit/dsa"]

[dependencies]
# The agent protocol and server; this crate adds the OnlyKey and FIDO backends.
# Until it is on crates.io, build against a local checkout with a git-ignored
# `.cargo/config.toml`; see "Development" in the README.
ssh-agent-kit = "1.0.0"
ssh-key = { version = "0.6.7", features = ["ed25519", "p256", "p384", "p521", "rsa"] }
ssh-encoding = { version = "0.2", features = ["base64"] }
signature = "2"
sha2 = { version = "0.10", features = ["oid"] }
rsa = "0.9"
deunicode = "1"
hex = "0.4"
thiserror = "2"
tracing = "0.1"
nix = { version = "0.30", features = ["fs", "user", "term", "process", "socket"] }
serde = { version = "1", features = ["derive"], optional = true }
minicbor = { version = "2.3.0", features = ["std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
# CTAP2 clientPIN: ECDH key agreement, AES-256-CBC and HMAC/HKDF-SHA-256.
p256 = { version = "0.13", features = ["ecdh"] }
aes = "0.8"
cbc = "0.1"
hmac = "0.12"
hkdf = "0.12"

# hidraw on Linux; hidapi's IOKit backend elsewhere (macOS).
[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["linux-native-basic-udev"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
hidapi = { version = "2.6", default-features = false }

[dev-dependencies]
ssh-agent-kit = { version = "1.0.0", features = ["test-util"] }
serde_json = "1"
tempfile = "3"
ed25519-dalek = "2"
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }

[lints]
workspace = true
