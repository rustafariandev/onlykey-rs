[workspace]
members = ["okagent"]

[workspace.package]
version = "1.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/rustafariandev/onlykey-rs"

[workspace.lints.clippy]
all = "warn"

[package]
name = "onlykey-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Derive SSH keys and sign with an OnlyKey hardware token"
keywords = ["onlykey", "ssh", "ssh-agent", "hardware-token", "hid"]
categories = ["authentication", "cryptography", "hardware-support"]
readme = "README.md"

[features]
default = []
# `serde` derives on `Curve`, for config files.
serde = ["dep:serde"]
# Test doubles: a scripted HID transport (`transport::fake`) and a software
# FIDO authenticator (`fido::fake`), for testing code built on this crate.
test-util = []

[dependencies]
# Challenge confirmation types shared with the agent. Until it is on crates.io,
# build against a local checkout with a git-ignored `.cargo/config.toml`; see
# "Development" in the README.
ssh-agent-kit = "1.0.0"
ssh-key = { version = "0.6.7", features = ["ed25519", "p256", "rsa"] }
ssh-encoding = "0.2"
signature = "2"
sha2 = "0.10"
deunicode = "1"
hex = "0.4"
thiserror = "2"
tracing = "0.1"
nix = { version = "0.30", features = ["fs", "term", "process"] }
serde = { version = "1", features = ["derive"], optional = true }
minicbor = { version = "2.3.0", features = ["std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
# CTAP2 clientPIN: ECDH key agreement, AES-256-CBC and HMAC/HKDF-SHA-256.
p256 = { version = "0.13", features = ["ecdh"] }
aes = "0.8"
cbc = "0.1"
hmac = "0.12"
hkdf = "0.12"

# hidraw on Linux; hidapi's IOKit backend elsewhere (macOS).
[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["linux-native-basic-udev"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
hidapi = { version = "2.6", default-features = false }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
rsa = "0.9"
ed25519-dalek = "2"
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }

[lints]
workspace = true
